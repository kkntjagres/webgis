<!doctype html>
<html lang="id" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard GIS Pertanian Jamus 🌾</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; overflow: hidden; }
    #map { z-index: 1; position: absolute; inset: 0; }
    .ui-overlay { z-index: 1000; pointer-events: none; position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 1.5rem; }
    .pointer-auto { pointer-events: auto; }
    .glass-effect { background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.4); box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12); }
    
    /* ELITE COMPASS STYLING */
    .compass-plate { background: radial-gradient(circle, #ffffff 0%, #f8fafc 100%); transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
    .compass-plate:hover { transform: scale(1.08) rotate(5deg); box-shadow: 0 20px 50px rgba(16, 185, 129, 0.2); }
    .north-point { filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.5)); }
    .tick-mark { position: absolute; width: 1px; height: 100%; background: linear-gradient(to bottom, #cbd5e1 5%, transparent 5%, transparent 95%, #cbd5e1 95%); }

    /* Custom Popup */
    .leaflet-popup-content-wrapper { border-radius: 24px; padding: 0; overflow: hidden; }
    .leaflet-popup-content { margin: 0; width: 230px !important; }
    
    .leaflet-control-zoom { border: none !important; margin-bottom: 110px !important; margin-right: 20px !important; }
    .leaflet-control-zoom-in, .leaflet-control-zoom-out { border-radius: 12px !important; background: white !important; color: #059669 !important; border: 1px solid #e2e8f0 !important; }
  </style>
 </head>
 <body class="h-full bg-slate-900">
  
  <div id="loader" class="fixed inset-0 z-[9999] flex items-center justify-center bg-white transition-opacity duration-700">
    <div class="flex flex-col items-center">
      <div class="w-16 h-16 border-4 border-emerald-100 border-t-emerald-600 rounded-full animate-spin"></div>
      <p class="mt-4 text-emerald-800 font-bold tracking-tight">Loading Data... 🛰️</p>
    </div>
  </div>

  <div id="map"></div>

  <div class="ui-overlay">
    <div class="flex flex-col md:flex-row justify-between items-start gap-4">
      <header class="glass-effect p-4 rounded-[2rem] shadow-2xl max-w-sm w-full border-l-[12px] border-emerald-500 pointer-auto">
          <div class="flex items-center gap-4">
            <img src="demak.png" alt="Logo Kabupaten Demak" class="w-14 h-14 object-contain drop-shadow-sm">
            <div>
              <h1 class="text-xl font-extrabold text-slate-800 leading-none text-emerald-700">Pertanian Unggulan</h1>
              <p class="text-[10px] font-bold text-slate-500 uppercase tracking-[0.2em] mt-1">Desa Jamus, Kab. Demak</p>
            </div>
          </div>
      </header>

      <div class="flex items-center gap-4 pointer-auto">
          <div class="flex gap-2 bg-white/40 p-2 rounded-[2.8rem] backdrop-blur-md border border-white/40 shadow-inner">
              <div class="bg-white/95 p-3 px-5 rounded-[2rem] text-center shadow-md min-w-[105px] border border-yellow-100">
                  <p class="text-[9px] font-black text-slate-400 uppercase tracking-tighter mb-1">🌾 PADI</p>
                  <p id="stat-padi" class="text-lg font-extrabold text-yellow-600 leading-tight">0 Ha</p>
              </div>
              <div class="bg-white/95 p-3 px-5 rounded-[2rem] text-center shadow-md min-w-[105px] border border-green-100">
                  <p class="text-[9px] font-black text-slate-400 uppercase tracking-tighter mb-1">🍌 PISANG</p>
                  <p id="stat-pisang" class="text-lg font-extrabold text-green-600 leading-tight">0 Ha</p>
              </div>
              <div class="bg-white/95 p-3 px-5 rounded-[2rem] text-center shadow-md min-w-[105px] border border-orange-100">
                  <p class="text-[9px] font-black text-slate-400 uppercase tracking-tighter mb-1">🌽 JAGUNG</p>
                  <p id="stat-jagung" class="text-lg font-extrabold text-orange-600 leading-tight">0 Ha</p>
              </div>
          </div>

          <div class="compass-plate w-28 h-28 rounded-full flex items-center justify-center border-4 border-white shadow-[0_20px_40px_rgba(0,0,0,0.15)] relative">
              <div class="absolute inset-0 p-1 opacity-40">
                <div class="tick-mark left-1/2 -translate-x-1/2 rotate-0"></div>
                <div class="tick-mark left-1/2 -translate-x-1/2 rotate-45"></div>
                <div class="tick-mark left-1/2 -translate-x-1/2 rotate-90"></div>
                <div class="tick-mark left-1/2 -translate-x-1/2 rotate-135"></div>
              </div>
              
              <div class="relative w-full h-full flex items-center justify-center">
                  <span class="absolute top-1.5 text-[15px] font-black text-red-600 north-point">U</span>
                  <span class="absolute left-2.5 text-[10px] font-black text-slate-500">B</span>
                  <span class="absolute right-2.5 text-[10px] font-black text-slate-500">T</span>
                  <span class="absolute bottom-1.5 text-[10px] font-black text-slate-500">S</span>
                  
                  <div class="absolute w-1 h-1 bg-slate-300 rounded-full translate-x-7 -translate-y-7"></div>
                  <div class="absolute w-1 h-1 bg-slate-300 rounded-full -translate-x-7 -translate-y-7"></div>
                  <div class="absolute w-1 h-1 bg-slate-300 rounded-full translate-x-7 translate-y-7"></div>
                  <div class="absolute w-1 h-1 bg-slate-300 rounded-full -translate-x-7 translate-y-7"></div>

                  <svg class="w-16 h-16 drop-shadow-2xl" viewBox="0 0 100 100">
                      <path d="M50 25 L55 45 L75 50 L55 55 L50 75 L45 55 L25 50 L45 45 Z" fill="#e2e8f0" opacity="0.5"/>
                      <path d="M50 8 L60 50 L50 45 Z" fill="#ef4444"/>
                      <path d="M50 8 L40 50 L50 45 Z" fill="#b91c1c"/>
                      <path d="M50 92 L40 50 L50 55 Z" fill="#94a3b8"/>
                      <path d="M50 92 L60 50 L50 55 Z" fill="#475569"/>
                      <circle cx="50" cy="50" r="6" fill="#1e293b" stroke="white" stroke-width="1.5"/>
                      <circle cx="50" cy="50" r="2.5" fill="#10b981"/>
                  </svg>
              </div>
          </div>
      </div>
    </div>

    <div class="flex flex-col md:flex-row justify-between items-end gap-4">
      <aside class="glass-effect w-full md:w-80 p-8 rounded-[2.8rem] pointer-auto">
        <h3 class="font-extrabold text-slate-800 mb-6 flex items-center gap-3">
          <span class="w-1.5 h-7 bg-emerald-500 rounded-full shadow-sm"></span> Legenda
        </h3>
        <div class="space-y-4">
          <div class="flex items-center gap-4 group cursor-pointer">
              <div class="w-6 h-6 rounded-lg bg-yellow-400 border-2 border-white shadow-md group-hover:scale-110 transition-transform"></div>
              <span class="text-sm font-bold text-slate-700">Lahan Sawah Padi</span>
          </div>
          <div class="flex items-center gap-4 group cursor-pointer">
              <div class="w-6 h-6 rounded-lg bg-green-500 border-2 border-white shadow-md group-hover:scale-110 transition-transform"></div>
              <span class="text-sm font-bold text-slate-700">Kebun Pisang</span>
          </div>
          <div class="flex items-center gap-4 group cursor-pointer">
              <div class="w-6 h-6 rounded-lg bg-orange-500 border-2 border-white shadow-sm group-hover:scale-110 transition-transform"></div>
              <span class="text-sm font-bold text-slate-700">Lahan Jagung</span>
          </div>
          <div class="flex items-center gap-4 group cursor-pointer">
              <div class="w-8 h-1.5 bg-blue-600 rounded-full shadow-sm group-hover:scale-x-110 transition-transform origin-left"></div>
              <span class="text-sm font-bold text-slate-700">Irigasi (DI Penggaron)</span>
          </div>
          <div class="flex items-center gap-4 group cursor-pointer">
              <div class="w-8 h-1 bg-white border border-slate-300 rounded-full shadow-sm group-hover:scale-x-110 transition-transform origin-left"></div>
              <span class="text-sm font-bold text-slate-700">Jalan Lingkungan</span>
          </div>
          <div class="flex items-center gap-4 group cursor-pointer">
    <div class="w-8 h-0 border-t-2 border-yellow-400 border-dashed group-hover:scale-x-110 transition-transform origin-left"></div>
    <span class="text-sm font-bold text-slate-700">Batas Desa</span>
</div>
        </div>
        <button onclick="resetZoom()" class="mt-8 w-full py-4.5 bg-emerald-600 text-white rounded-2xl font-black text-xs tracking-[0.2em] hover:bg-emerald-700 shadow-xl active:scale-95 transition-all">
          PUSATKAN PETA
        </button>
      </aside>

      <div class="glass-effect px-6 py-3 rounded-full shadow-xl text-[11px] text-slate-600 font-extrabold uppercase tracking-[0.15em] flex items-center gap-3 mb-2 pointer-auto border-b-2 border-emerald-500/20">
        <span class="flex h-3 w-3 rounded-full bg-emerald-500 animate-pulse"></span>
        KKN-T UNDIP TIM 23 2026
      </div>
    </div>
  </div>

  <script>
    let map, geojsonLayer, batasLayer;

    function initMap() {
      map = L.map('map', { zoomControl: false, attributionControl: false }).setView([-7.001, 110.498], 15);
      L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', { maxZoom: 20 }).addTo(map);
      L.control.zoom({ position: 'bottomright' }).addTo(map);

      // Load Batas Desa
      fetch('batasdesa.geojson').then(res => res.json()).then(data => {
        batasLayer = L.geoJSON(data, { style: { color: '#ffff00', weight: 4, dashArray: '12, 12', fillOpacity: 0, interactive: false } }).addTo(map);
        map.fitBounds(batasLayer.getBounds(), { padding: [50, 50] });
      });

      // Infrastruktur
      fetch('jalan.geojson').then(res => res.json()).then(data => L.geoJSON(data, { style: { color: '#ffffff', weight: 2.8, opacity: 0.95 } }).addTo(map));
      fetch('irigasi.geojson').then(res => res.json()).then(data => L.geoJSON(data, { style: { color: '#2563eb', weight: 4.5, opacity: 1 } }).addTo(map));

      // Komoditas Terupdate
      fetch('komoditas.geojson').then(res => res.json()).then(data => {
        calculateStats(data);
        geojsonLayer = L.geoJSON(data, {
          style: (f) => ({
            fillColor: f.properties.Lahan === 'Padi' ? '#facc15' : f.properties.Lahan === 'Pisang' ? '#22c55e' : '#f97316',
            weight: 1.8, color: 'white', fillOpacity: 0.78
          }),
          onEachFeature: onEachFeature
        }).addTo(map);
        document.getElementById('loader').classList.add('opacity-0');
        setTimeout(() => document.getElementById('loader').remove(), 700);
      });
    }

    function onEachFeature(feature, layer) {
      layer.on({
        mouseover: (e) => { e.target.setStyle({ weight: 4, fillOpacity: 0.9, color: '#fff' }); e.target.bringToFront(); },
        mouseout: (e) => { geojsonLayer.resetStyle(e.target); }
      });
      const p = feature.properties;
      layer.bindPopup(`
        <div class="custom-popup">
            <div class="bg-gradient-to-r from-emerald-600 to-emerald-500 p-4 text-white">
                <h3 class="text-lg font-black leading-tight">${p.Lahan}</h3>
                <p class="text-[9px] font-bold opacity-75 uppercase tracking-widest mt-1">Sektor Pertanian</p>
            </div>
            <div class="p-5 space-y-3">
                <div class="flex justify-between items-center"><span class="text-[10px] font-black text-slate-400 uppercase">Luas Area</span><span class="text-sm font-black text-emerald-600">${p.Luas_Ha} Ha</span></div>
                <div class="flex justify-between items-center"><span class="text-[10px] font-black text-slate-400 uppercase">Sistem Air</span><span class="text-[11px] font-bold text-slate-700">${p.Irigasi || '-'}</span></div>
                <div class="border-t border-slate-100 pt-3 flex justify-between items-center"><span class="text-[10px] font-black text-slate-400 uppercase">Produksi</span><span class="text-[11px] font-bold text-slate-700">${p['Pro_Ton/Ha'] || '-'} Ton/Ha</span></div>
            </div>
        </div>`);
    }

    function calculateStats(data) {
      let stats = { Padi: 0, Pisang: 0, Jagung: 0 };
      data.features.forEach(f => {
        if (stats[f.properties.Lahan] !== undefined) stats[f.properties.Lahan] += parseFloat(f.properties.Luas_Ha) || 0;
      });
      document.getElementById('stat-padi').innerText = `${stats.Padi.toFixed(2)} Ha`;
      document.getElementById('stat-pisang').innerText = `${stats.Pisang.toFixed(2)} Ha`;
      document.getElementById('stat-jagung').innerText = `${stats.Jagung.toFixed(2)} Ha`;
    }

    function resetZoom() { if(batasLayer) map.fitBounds(batasLayer.getBounds(), { padding: [80, 80] }); }
    document.addEventListener('DOMContentLoaded', initMap);
  </script>
 </body>
</html>
